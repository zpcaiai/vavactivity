apiVersion: v1
kind: ConfigMap
metadata: {name: vav-runtime}
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_LOG_LEVEL: INFO
  AUTH_COOKIE_SECURE: "true"
  AUTH_PRIVATE_KEY_FILE: /run/secrets/auth-private.pem
  AUTH_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
  PAYMENT_TEST_FAKE_ENABLED: "false"
  NOTIFICATION_EMAIL_PROVIDER: transactional
  AI_MODEL_PROVIDER: approved
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
