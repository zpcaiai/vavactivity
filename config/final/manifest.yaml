schema_version: "1.0.0"
batch: 32
name: vav-production-certification
release_version: "2026.08.07"
release_track: "rc"
environment: production
non_waivable_gates:
  - BATCH-28-REGRESSION
  - BATCH-29-PERFORMANCE
  - BATCH-30-SECURITY
  - BATCH-31-RESILIENCE
quality_scores:
  minimum_overall_threshold: 0.94
go_no_go:
  threshold: 0.94
  required_dims:
    - security_privacy
    - resilience
    - project_governance
  critical_findings_max: 0
release_manifest:
  schema_version: "1.0.0"
  non_waivable_gate_artifacts:
    BATCH-28-REGRESSION: build/regression/regression-evidence.json
    BATCH-29-PERFORMANCE: build/performance/performance-evidence.json
    BATCH-30-SECURITY: build/security/security-evidence.json
    BATCH-31-RESILIENCE: build/resilience/resilience-evidence.json
  required_artifacts:
    - build/quality/release-quality-report.json
    - build/ui/accessibility.json
    - build/process/process-evidence.json
    - build/data/data-integrity-evidence.json
    - build/admin/admin-completeness-evidence.json
    - build/regression/regression-evidence.json
    - build/performance/performance-evidence.json
    - build/security/security-evidence.json
    - build/resilience/resilience-evidence.json
launch:
  preconditions:
    - true
    - true
    - true
    - true
  gate_checks:
    - final_score_verified
    - go_no_go_positive
    - approvals_valid
    - observation_policy_confirmed
approvals:
  production_owner:
    required: true
  security_owner:
    required: true
  data_governance_owner:
    required: true
observation_windows:
  24h:
    required_hours: 24
    policy: allow_stable_rollover
  7d:
    required_hours: 168
    policy: gated_review
  30d:
    required_hours: 720
    policy: stable_certification_hold
security_posture:
  external_pen_test_required: true
  critical_open_findings_max: 0
  unresolved_sev1_findings_max: 0
  launch_gates:
    - no_unauthorized_admin_action
    - no_runtime_privilege_escalation
    - no_data_export_without_erasure_token
