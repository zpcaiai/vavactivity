name: Docker Build

on:
  pull_request:
    paths:
      - "services/**"
      - "infra/docker/**"
      - "docker-compose.yml"
      - "uv.lock"

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
