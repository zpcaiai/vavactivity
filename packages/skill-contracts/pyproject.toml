[project]
name = "vav-skill-contracts"
version = "1.0.0"
description = "Schema compatibility and deterministic code generation for VAV Skills"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.25.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vav_skill_contracts"]

[tool.ruff]
line-length = 100
