name: vav-platform

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vav}
      POSTGRES_USER: ${POSTGRES_USER:-vav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vav_local_development_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [vav-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [vav-internal]

  redis:
    image: redis:7.4.2-alpine3.21
    command: [redis-server, --appendonly, "yes", --save, "60", "1"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [vav-redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [vav-internal]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vav_minio_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vav_minio_local_development_only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [vav-minio-data:/data]
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [vav-internal]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vav_minio_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vav_minio_local_development_only}
      MINIO_BUCKET_PRIVATE: ${MEDIA_S3_BUCKET_PRIVATE:-vav-private}
      MINIO_BUCKET_PUBLIC: ${MEDIA_S3_BUCKET_PUBLIC:-vav-public}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET_PRIVATE}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET_PUBLIC}"
        mc anonymous set none "local/$${MINIO_BUCKET_PRIVATE}"
        mc anonymous set download "local/$${MINIO_BUCKET_PUBLIC}"
    networks: [vav-internal]

networks:
  vav-public: {}
  vav-internal: {internal: true}

volumes:
  vav-postgres-data: {}
  vav-redis-data: {}
  vav-minio-data: {}
  vav-grafana-data: {}
  vav-loki-data: {}
  vav-tempo-data: {}
