name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: vav
          POSTGRES_USER: vav
          POSTGRES_PASSWORD: vav_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vav -d vav"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vav:vav_ci_only@localhost:5432/vav
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run ruff check services
      - run: uv run ruff format --check services
      - run: uv run mypy services/api/src services/worker/src
      - run: uv run --package vav-platform-api pytest services/api/tests
      - run: uv run --package vav-platform-api alembic -c services/api/alembic.ini upgrade head
      - run: uv run --package vav-platform-api python scripts/check_migration_heads.py
      - run: uv run --package vav-platform-api alembic -c services/api/alembic.ini check

