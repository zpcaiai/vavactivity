name: vav-platform

x-backend-environment: &backend-environment
  APP_ENV: development
  DATABASE_URL: postgresql+asyncpg://vav:${POSTGRES_PASSWORD:-vav_local_development_only}@postgres:5432/vav
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  AUTH_PRIVATE_KEY_FILE: /run/secrets/auth-private.pem
  AUTH_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MEDIA_S3_ENDPOINT: http://minio:9000
  MEDIA_S3_PUBLIC_ENDPOINT: http://localhost:9000
  MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-vav_minio_local}
  MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-vav_minio_local_development_only}
  MEDIA_S3_BUCKET_PUBLIC: ${MEDIA_S3_BUCKET_PUBLIC:-vav-public}
  MEDIA_S3_BUCKET_PRIVATE: ${MEDIA_S3_BUCKET_PRIVATE:-vav-private}
  BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-local-backup-key-change-me}
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_MODEL_PROVIDER: ${AI_MODEL_PROVIDER:-deterministic_local}

x-worker: &worker
  build:
    context: ../..
    dockerfile: infra/docker/backend.Dockerfile
    target: development
  env_file: [../../.env]
  environment: *backend-environment
  working_dir: /app
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio-init: {condition: service_completed_successfully}
  volumes:
    - ../../.dev-secrets/auth-private.pem:/run/secrets/auth-private.pem:ro
    - ../../.dev-secrets/auth-public.pem:/run/secrets/auth-public.pem:ro
    - ../../config:/app/config:ro
  networks: [vav-internal]

services:
  mailpit:
    image: axllent/mailpit:v1.21.8
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [vav-internal, vav-public]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    env_file: [../../.env]
    environment: *backend-environment
    command: [uvicorn, vav.main:app, --host, 0.0.0.0, --port, "8000", --reload]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      mailpit: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ../../.dev-secrets/auth-private.pem:/run/secrets/auth-private.pem:ro
      - ../../.dev-secrets/auth-public.pem:/run/secrets/auth-public.pem:ro
      - ../../services:/app/services
      - ../../config:/app/config:ro
      - ../../scripts:/app/scripts:ro
      - ../../backups:/app/backups
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [vav-internal, vav-public]

  worker:
    <<: *worker
    command: [celery, --app, vav_worker.celery_app:celery_app, worker, --loglevel=INFO, --hostname=default@%h, "--queues=default,commerce,activities,courses,counseling,knowledge"]
    healthcheck:
      test: [CMD-SHELL, "celery --app vav_worker.celery_app:celery_app inspect ping --timeout 5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 10

  worker-ai:
    <<: *worker
    profiles: [workers, full]
    command: [celery, --app, vav_worker.celery_app:celery_app, worker, --loglevel=INFO, --hostname=ai@%h, "--queues=ai,knowledge,recommendations"]

  worker-notifications:
    <<: *worker
    profiles: [workers, full]
    command: [celery, --app, vav_worker.celery_app:celery_app, worker, --loglevel=INFO, --hostname=notifications@%h, --queues=notifications]

  worker-privacy:
    <<: *worker
    profiles: [workers, full]
    command: [celery, --app, vav_worker.celery_app:celery_app, worker, --loglevel=INFO, --hostname=privacy@%h, --queues=privacy]

  worker-safety:
    <<: *worker
    profiles: [workers, full]
    command: [celery, --app, vav_worker.celery_app:celery_app, worker, --loglevel=INFO, --hostname=safety@%h, --queues=safety]

  worker-media:
    <<: *worker
    profiles: [workers, full]
    command: [celery, --app, vav_worker.celery_app:celery_app, worker, --loglevel=INFO, --hostname=media@%h, --queues=media]

  scheduler:
    <<: *worker
    command: [celery, --app, vav_worker.celery_app:celery_app, beat, --loglevel=INFO, --pidfile=/tmp/celerybeat.pid]
    tmpfs: [/tmp]

  user-web:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      target: development
    command: [corepack, pnpm, --filter, "@vav/user-web", dev]
    environment: {VITE_API_BASE_URL: http://localhost:8000/api/v1}
    depends_on: {api: {condition: service_healthy}}
    ports: ["127.0.0.1:5173:5173"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [vav-public]

  admin-web:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      target: development
    command: [corepack, pnpm, --filter, "@vav/admin-web", dev]
    environment: {VITE_API_BASE_URL: http://localhost:8000/api/v1}
    depends_on: {api: {condition: service_healthy}}
    ports: ["127.0.0.1:5174:5174"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5174/admin/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [vav-public]

  reverse-proxy:
    image: nginx:1.27.4-alpine3.21
    profiles: [web, full]
    depends_on:
      api: {condition: service_healthy}
      user-web: {condition: service_healthy}
      admin-web: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
    volumes: [../reverse-proxy/development.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [vav-public]
