name: vav-platform

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vav}
      POSTGRES_USER: ${POSTGRES_USER:-vav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vav_local_development_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vav} -d ${POSTGRES_DB:-vav}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vav_minio_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vav_minio_local_development_only}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:5174}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vav_minio_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vav_minio_local_development_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-vav-private}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc mb --ignore-existing "local/${MEDIA_S3_BUCKET_PUBLIC:-vav-public}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        mc anonymous set download "local/${MEDIA_S3_BUCKET_PUBLIC:-vav-public}"

  mailpit:
    image: axllent/mailpit:v1.21.8
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      AUTH_PRIVATE_KEY_FILE: /run/secrets/auth-private.pem
      AUTH_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-http://minio:9000}
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-vav_minio_local}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-vav_minio_local_development_only}
      MEDIA_S3_BUCKET_PUBLIC: ${MEDIA_S3_BUCKET_PUBLIC:-vav-public}
      MEDIA_S3_BUCKET_PRIVATE: ${MEDIA_S3_BUCKET_PRIVATE:-vav-private}
      AI_ENABLED: ${AI_ENABLED:-true}
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-true}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-mailpit}
      PRIVACY_ENABLED: ${PRIVACY_ENABLED:-true}
      PRIVACY_SEARCH_HMAC_PEPPER: ${PRIVACY_SEARCH_HMAC_PEPPER:-local-privacy-search-hmac-only}
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
    command:
      - /bin/sh
      - -ec
      - |
        alembic upgrade head
        uvicorn vav.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./.dev-secrets/auth-private.pem:/run/secrets/auth-private.pem:ro
      - ./.dev-secrets/auth-public.pem:/run/secrets/auth-public.pem:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      AUTH_PRIVATE_KEY_FILE: /run/secrets/auth-private.pem
      AUTH_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-http://minio:9000}
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-vav_minio_local}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-vav_minio_local_development_only}
      MEDIA_S3_BUCKET_PUBLIC: ${MEDIA_S3_BUCKET_PUBLIC:-vav-public}
      MEDIA_S3_BUCKET_PRIVATE: ${MEDIA_S3_BUCKET_PRIVATE:-vav-private}
      PRIVACY_ENABLED: ${PRIVACY_ENABLED:-true}
      PRIVACY_SEARCH_HMAC_PEPPER: ${PRIVACY_SEARCH_HMAC_PEPPER:-local-privacy-search-hmac-only}
    working_dir: /app
    command:
      [
        "celery",
        "--app",
        "vav_worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--hostname=worker@%h"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.dev-secrets/auth-private.pem:/run/secrets/auth-private.pem:ro
      - ./.dev-secrets/auth-public.pem:/run/secrets/auth-public.pem:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --app vav_worker.celery_app:celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong"
        ]
      interval: 20s
      timeout: 10s
      retries: 10

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      AUTH_PRIVATE_KEY_FILE: /run/secrets/auth-private.pem
      AUTH_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-http://minio:9000}
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-vav_minio_local}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-vav_minio_local_development_only}
      MEDIA_S3_BUCKET_PUBLIC: ${MEDIA_S3_BUCKET_PUBLIC:-vav-public}
      MEDIA_S3_BUCKET_PRIVATE: ${MEDIA_S3_BUCKET_PRIVATE:-vav-private}
      PRIVACY_ENABLED: ${PRIVACY_ENABLED:-true}
      PRIVACY_SEARCH_HMAC_PEPPER: ${PRIVACY_SEARCH_HMAC_PEPPER:-local-privacy-search-hmac-only}
    working_dir: /app
    command:
      [
        "celery",
        "--app",
        "vav_worker.celery_app:celery_app",
        "beat",
        "--loglevel=INFO"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.dev-secrets/auth-private.pem:/run/secrets/auth-private.pem:ro
      - ./.dev-secrets/auth-public.pem:/run/secrets/auth-public.pem:ro

  user-web:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    command: ["corepack", "pnpm", "--filter", "@vav/user-web", "dev"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  admin-web:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    command: ["corepack", "pnpm", "--filter", "@vav/admin-web", "dev"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5174:5174"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5174/admin/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
