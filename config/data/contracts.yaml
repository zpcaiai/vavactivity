schema_version: "1.0"
contracts:
  - {code: identity.user.v1, type: table, asset: identity.users, producer: identity, consumers: [privacy, experience, system], policy: backward, required: [user_id, status, version], sensitive: [email, password_hash]}
  - {code: commerce.order.v1, type: table, asset: commerce.orders, producer: commerce, consumers: [memberships, process_governance], policy: full, required: [order_id, user_id, status, version], sensitive: []}
  - {code: commerce.payment-event.v1, type: event, asset: commerce.payments, producer: commerce, consumers: [commerce, memberships, process_governance], policy: backward, required: [event_id, payment_id, aggregate_version, status], sensitive: [provider_reference]}
  - {code: commerce.entitlement.v1, type: table, asset: commerce.entitlements, producer: commerce, consumers: [memberships, courses, activities], policy: full, required: [entitlement_id, user_id, status, version], sensitive: []}
  - {code: membership.account.v1, type: table, asset: memberships.accounts, producer: memberships, consumers: [experience, recommendations], policy: full, required: [membership_account_id, user_id, status, version], sensitive: []}
  - {code: activity.registration.v1, type: table, asset: activities.registrations, producer: activities, consumers: [experience, notifications], policy: backward, required: [registration_id, user_id, status, version], sensitive: []}
  - {code: activity.ticket.v1, type: table, asset: activities.tickets, producer: activities, consumers: [experience], policy: backward, required: [ticket_id, registration_id, status, version], sensitive: []}
  - {code: course.enrollment.v1, type: table, asset: courses.enrollments, producer: courses, consumers: [experience, privacy], policy: backward, required: [enrollment_id, user_id, status, version], sensitive: []}
  - {code: counseling.appointment.v1, type: table, asset: counseling.appointments, producer: counseling, consumers: [experience, notifications, privacy], policy: backward, required: [appointment_id, user_id, status, version], sensitive: [notes_encrypted]}
  - {code: matchmaking.profile.v1, type: table, asset: matchmaking.profiles, producer: matchmaking_profiles, consumers: [recommendations, privacy], policy: full, required: [profile_id, user_id, review_status, version], sensitive: [private_profile_fields]}
  - {code: interaction.match.v1, type: event, asset: interactions.matches, producer: matchmaking_interactions, consumers: [relationships, notifications], policy: backward, required: [event_id, canonical_pair_id, aggregate_version], sensitive: []}
  - {code: interaction.like.v1, type: table, asset: interactions.likes, producer: matchmaking_interactions, consumers: [matchmaking_interactions, privacy], policy: full, required: [like_id, canonical_pair_id, actor_user_id, version], sensitive: []}
  - {code: membership.quota.v1, type: table, asset: memberships.quotas, producer: memberships, consumers: [activities, counseling, experience], policy: full, required: [quota_id, membership_account_id, remaining, version], sensitive: []}
  - {code: relationship.journey.v1, type: table, asset: relationships.journeys, producer: relationships, consumers: [experience, privacy], policy: full, required: [relationship_journey_id, canonical_pair_id, stage, version], sensitive: []}
  - {code: skill.installation.v1, type: table, asset: skills.installations, producer: skills_platform, consumers: [system, quality], policy: backward, required: [skill_installation_id, status, version], sensitive: []}
  - {code: safety.block.v1, type: event, asset: safety.blocks, producer: trust_safety, consumers: [recommendations, matchmaking_interactions, relationships, experience], policy: full, required: [event_id, blocker_user_id, blocked_user_id, aggregate_version], sensitive: [reason_code]}
  - {code: privacy.erasure.v1, type: event, asset: privacy.requests, producer: privacy, consumers: [data_governance, experience, recommendations, ai_assistant], policy: full, required: [event_id, privacy_request_id, subject_user_id, aggregate_version], sensitive: []}
  - {code: experience.search.v1, type: search, asset: experience.search_index, producer: experience, consumers: [experience], policy: backward, required: [document_code, source_entity_id, source_version, visibility], sensitive: []}
  - {code: recommendation.card.v1, type: projection, asset: recommendations.cards, producer: recommendations, consumers: [experience], policy: backward, required: [recommendation_item_id, source_profile_version, policy_version], sensitive: []}
  - {code: privacy.export.v1, type: file, asset: privacy.export_archives, producer: privacy, consumers: [privacy], policy: none, required: [export_id, subject_user_id, expires_at, checksum], sensitive: [object_key]}
