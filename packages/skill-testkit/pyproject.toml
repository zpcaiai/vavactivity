[project]
name = "vav-skill-testkit"
version = "1.0.0"
description = "Production-parity harness helpers for VAV Skill tests"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.25.1", "vav-skill-sdk==1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vav_skill_testkit"]

[tool.ruff]
line-length = 100
