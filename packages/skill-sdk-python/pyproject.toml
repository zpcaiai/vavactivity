[project]
name = "vav-skill-sdk"
version = "1.0.0"
description = "Typed, fail-closed SDK for VAV Skill packages"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.25.1",
  "pydantic==2.11.7",
  "pyyaml==6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vav_skill_sdk"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
