name: Sync GitHub to Hugging Face Space

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to sync from GitHub to HF Space
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: vavactivity-hf-sync
  cancel-in-progress: false

env:
  HF_SPACE_REPO: StephenZao/vavactivity
  HF_TARGET_BRANCH_DEFAULT: main

jobs:
  sync:
    name: Sync to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN is not configured in GitHub Secrets."
            exit 1
          fi

      - name: Sync repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_BRANCH: ${{ github.event.inputs.target_branch || '' }}
        run: |
          set -euo pipefail

          SOURCE_BRANCH="${HF_TARGET_BRANCH:-${GITHUB_REF_NAME:-$HF_TARGET_BRANCH_DEFAULT}}"
          if [ -z "$SOURCE_BRANCH" ]; then
            SOURCE_BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          if [ -z "$SOURCE_BRANCH" ]; then
            SOURCE_BRANCH="$HF_TARGET_BRANCH_DEFAULT"
          fi
          echo "Source branch: $SOURCE_BRANCH"
          echo "HF target space: $HF_SPACE_REPO"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add hf "https://huggingface:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}.git"
          git remote -v
          git ls-remote hf "refs/heads/${SOURCE_BRANCH}" || true

          git push hf "HEAD:refs/heads/${SOURCE_BRANCH}" --force

          echo "Verification (remote HEAD):"
          git ls-remote hf "refs/heads/${SOURCE_BRANCH}"
