concurrency:
  background_job_profile:
    hourly_jobs: 11000
    critical_job_ratio: 0.2
  operations:
    - resource: safety.blocks
      key: user:{user_id}
      mode: write
      actors: 6
      scenario_code: BLK-001
    - resource: relationships.edges
      key: relation:{user_id}:{target_id}
      mode: write
      actors: 5
      scenario_code: REL-010
    - resource: recommendations.cache
      key: ranking:{bucket}
      mode: write
      actors: 2
      scenario_code: REC-101
    - resource: matches.list
      key: visible:{user_id}
      mode: read
      actors: 6
      scenario_code: MAT-030
  lock_orders:
    match-worker: [match_slot, relationship_slot, cache_lock]
    safety-worker: [report_row, user_profile, audit_log]
    payment-worker: [order_row, ledger_row, notification_queue]
    cycle-worker: [a, b, c, a]
  race_scenarios:
    - scenario_code: CURRENCY-EXCHANGE
      scenario_type: race
      mutating: true
      idempotency_key_expression: user_id + "+" + action_id
      expected_invariants:
        final_balance_not_negative: true
        ledger_consistency: true
      expected_result_distribution:
        ok: 3
        conflict_retried: 1
      concurrent_actor_count: 4
      synchronization_mode: provider_callback_race
      duplicate_callback_expected: true
    - scenario_code: CONTACT-REVEAL
      scenario_type: race
      mutating: true
      idempotency_key_expression: payload_id + ":" + user
      expected_invariants:
        reveal_count_leq_limit: true
        audit_covered: true
      expected_result_distribution:
        approved: 1
        rejected_by_rate_limit: 1
      concurrent_actor_count: 2
      synchronization_mode: scheduler_command_race
      duplicate_callback_expected: false
  race_observations:
    - scenario_code: CURRENCY-EXCHANGE
      result_distribution:
        ok: 3
        conflict_retried: 1
      invariants:
        final_balance_not_negative: true
        ledger_consistency: true
      duplicate_side_effects: 0
    - scenario_code: CONTACT-REVEAL
      result_distribution:
        approved: 1
        rejected_by_rate_limit: 1
      invariants:
        reveal_count_leq_limit: true
        audit_covered: true
      duplicate_side_effects: 0
