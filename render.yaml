# Render Blueprint Configuration (render.yaml)
# Docs: https://render.com/docs/blueprints
#
# This file automates the deployment of the VAV Backend API on Render.
# To deploy: Go to Render Dashboard -> Blueprints -> New Blueprint Instance -> Link this repo.

services:
  - type: web
    name: vav-platform-api
    runtime: docker
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: infra/docker/backend.Dockerfile
    dockerContext: .
    plan: free # Deploys on Render's free tier
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOG_LEVEL
        value: INFO
      - key: APP_CORS_ORIGINS
        value: '["https://vavactivity.vercel.app"]'
      - key: AUTH_ALLOWED_ORIGINS
        value: '["https://vavactivity.vercel.app"]'
      - key: USER_WEB_URL
        value: https://vavactivity.vercel.app
      - key: ADMIN_WEB_URL
        sync: false
      - key: PUBLIC_WEB_BASE_URL
        value: https://vavactivity.vercel.app
      - key: PUBLIC_API_BASE_URL
        value: https://vav-platform-api.onrender.com
      - key: AUTH_ISSUER
        value: vav-platform
      - key: AUTH_USER_AUDIENCE
        value: vav-user
      - key: AUTH_ADMIN_AUDIENCE
        value: vav-admin
      - key: AUTH_ACTIVE_KEY_ID
        value: prod-key-1
      - key: AUTH_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      # Staging intentionally permits direct sign-in while transactional email is not configured.
      # Settings validation forbids this value in production/DR.
      - key: AUTH_EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: PAYMENT_ENVIRONMENT
        value: test
      - key: PAYMENT_TEST_FAKE_ENABLED
        value: "false"
      - key: AI_ENABLED
        value: "true"
      - key: COURSE_VIDEO_PROVIDER
        value: approved_private
      - key: COUNSELING_MEETING_PROVIDER
        value: approved
      - key: KNOWLEDGE_EMBEDDING_PROVIDER
        value: approved
      - key: AI_MODEL_PROVIDER
        value: gemini
      - key: AI_MODEL_NAME
        value: gemini-3.6-flash
      - key: AI_CONVERSATION_ENCRYPTION_ENABLED
        value: "true"
      - key: NOTIFICATION_EMAIL_PROVIDER
        value: transactional
      - key: PRIVACY_FIELD_ENCRYPTION_ENABLED
        value: "true"
      - key: PRIVACY_EXPORT_ENCRYPTION_ENABLED
        value: "true"
      # Storage v2 activation is a separate operation after Neon is at 0112 and
      # this exact backend image is healthy. A pre-0112 rollback cannot read
      # objects finalized in the new namespace.
      - key: PROFILE_MEDIA_ENABLED
        value: "false"
      - key: QUALITY_ENABLED
        value: "false"

      # Render requests sync:false values when a Blueprint is first created.
      # Existing Blueprint instances must set them in Dashboard -> Environment.
      - key: DATABASE_URL
        sync: false # postgresql+asyncpg://...?sslmode=require
      # REDIS_URL is optional. Redis-backed capabilities fail closed when it is absent.
      - key: MEDIA_S3_ENDPOINT
        sync: false # HTTPS S3-compatible private endpoint.
      - key: MEDIA_S3_PUBLIC_ENDPOINT
        sync: false # HTTPS endpoint used to create browser upload URLs.
      - key: MEDIA_S3_ACCESS_KEY
        sync: false
      - key: MEDIA_S3_SECRET_KEY
        sync: false
      - key: AUTH_PRIVATE_KEY
        sync: false # Ed25519 private key PEM content.
      - key: AUTH_PUBLIC_KEY
        sync: false # Matching Ed25519 public key PEM content.
      - key: GEMINI_API_KEY
        sync: false # Restricted Gemini API auth key; never expose it to the browser.
      - key: AUTH_REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: PRIVACY_SEARCH_HMAC_PEPPER
        generateValue: true
      - key: NOTIFICATION_EMAIL_PROVIDER_WEBHOOK_SECRET
        generateValue: true
      # Salts the check-in last-four lookup; a known key makes that column a phone enumeration oracle.
      - key: CHECKIN_LAST_FOUR_HMAC_KEY
        generateValue: true
      # Signs the operator confirm/undo capability; forging one forges an attendance record.
      - key: CHECKIN_TOKEN_SIGNING_KEY
        generateValue: true
      # Signs share links.
      - key: SHARE_LINK_SECRET
        generateValue: true
      # Signs per-asset private media access grants.
      - key: PROFILE_MEDIA_TOKEN_SECRET
        generateValue: true
      # Pseudonymizes the coarse IP marker; a known salt re-identifies it.
      - key: DISCOVERY_IP_MARKER_SALT
        generateValue: true
