name: "[DISABLED] Sync GitHub to Hugging Face Space (Docker)"
# Disabled: HuggingFace free accounts no longer support Docker Spaces.
# Use .github/workflows/huggingface-static.yml instead (Static Space, free).

on:
  workflow_dispatch:
    inputs:
      _note:
        description: "This workflow is disabled. Use huggingface-static instead."
        required: false
      target_branch:
        description: Target branch in the Hugging Face Space
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: vavactivity-hf-sync
  cancel-in-progress: false

env:
  HF_SPACE_REPO: StephenZao/vavactivity
  HF_TARGET_BRANCH_DEFAULT: main

jobs:
  sync:
    if: github.repository == 'zpcaiai/vavactivity'
    name: Sync to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout frontend source
        uses: actions/checkout@v7
        with:
          repository: zpcaiai/vavactivityWeb
          path: frontend-source
          persist-credentials: false

      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN is not configured in GitHub Secrets."
            exit 1
          fi

      - name: Sync repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_BRANCH: ${{ github.event.inputs.target_branch || '' }}
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${GITHUB_REF_NAME:-}"
          SOURCE_BRANCH="${SOURCE_BRANCH:-$HF_TARGET_BRANCH_DEFAULT}"
          HF_TARGET_BRANCH="${HF_TARGET_BRANCH:-$SOURCE_BRANCH}"
          export HF_TARGET_BRANCH
          export VAV_WEB_ROOT="$GITHUB_WORKSPACE/frontend-source"
          echo "Source branch: $SOURCE_BRANCH"
          echo "Configured target branch: $HF_TARGET_BRANCH"
          echo "HF target space: $HF_SPACE_REPO"
          scripts/hf/sync-to-space.sh "$SOURCE_BRANCH"
