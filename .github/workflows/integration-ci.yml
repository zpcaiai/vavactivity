name: Integration CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAV_WEB_ROOT: ${{ github.workspace }}/web
    steps:
      - uses: actions/checkout@v7
        with: {path: backend}
      - uses: actions/checkout@v7
        with:
          repository: zpcaiai/vavactivityWeb
          path: web
      - name: Configure split checkout
        working-directory: backend
        run: cp .env.example .env && ./scripts/generate-dev-auth-keys.sh
      - name: Verify frontend handoff contracts
        working-directory: backend
        run: python3 scripts/diagnostics/check_frontend_contracts.py
      - run: docker compose config --quiet
        working-directory: backend
      - run: docker compose up -d --build
        working-directory: backend
      - run: ./scripts/wait-for-services.sh
        working-directory: backend
      - run: docker compose exec -T api alembic upgrade head
        working-directory: backend
      - run: curl --fail http://localhost:5173
      - run: curl --fail http://localhost:5174/admin/login
      - if: always()
        run: docker compose logs --no-color
        working-directory: backend
