name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.2
        with:
          args: git --verbose --redact --no-banner /github/workspace
