apiVersion: v1
kind: ConfigMap
metadata: {name: vav-runtime}
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_LOG_LEVEL: INFO
  AUTH_COOKIE_SECURE: "true"
  AUTH_PRIVATE_KEY_FILE: /run/secrets/auth-private.pem
  AUTH_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
  PAYMENT_TEST_FAKE_ENABLED: "false"
  NOTIFICATION_EMAIL_PROVIDER: transactional
  AI_ENABLED: "true"
  AI_MODEL_PROVIDER: gemini
  AI_MODEL_NAME: gemini-3.6-flash
  MEDIA_S3_ENDPOINT: https://object-storage.internal
  MEDIA_S3_PUBLIC_ENDPOINT: https://media.vav.example
  # Enable only after 0112 is applied and every API/worker/scheduler pod is on
  # the approved storage-v2 image. Kubernetes does not auto-rollback Deployments.
  PROFILE_MEDIA_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
