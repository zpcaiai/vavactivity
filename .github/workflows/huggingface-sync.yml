name: Sync GitHub to Hugging Face Space

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to sync from GitHub to HF Space
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: vavactivity-hf-sync
  cancel-in-progress: false

env:
  HF_SPACE_REPO: StephenZao/vavactivity
  HF_TARGET_BRANCH_DEFAULT: main

jobs:
  sync:
    name: Sync to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN is not configured in GitHub Secrets."
            exit 1
          fi

      - name: Sync repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_BRANCH: ${{ github.event.inputs.target_branch || '' }}
        run: |
          set -euo pipefail

          SOURCE_BRANCH="${GITHUB_REF_NAME:-}"
          if [ -z "$SOURCE_BRANCH" ]; then
            if [ -n "${GITHUB_REF:-}" ]; then
              SOURCE_BRANCH="${GITHUB_REF#refs/heads/}"
            fi
          fi
          if [ -z "$SOURCE_BRANCH" ]; then
            SOURCE_BRANCH="$HF_TARGET_BRANCH_DEFAULT"
          fi
          TARGET_BRANCH="${HF_TARGET_BRANCH:-$SOURCE_BRANCH}"

          echo "Source branch: $SOURCE_BRANCH"
          echo "Configured target branch: $TARGET_BRANCH"
          echo "HF target space: $HF_SPACE_REPO"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          HF_SYNC_DIR="${RUNNER_TEMP}/hf-sync-${GITHUB_RUN_ID}"
          mkdir -p "$HF_SYNC_DIR"
          rsync -a \
            --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".venv" \
            --exclude="node_modules" \
            --exclude="tests/ui/visual.spec.ts-snapshots" \
            --exclude="apps/user-web/src/assets/images/vav-hero-couple.png" \
            . "$HF_SYNC_DIR/"

          if [ -f "$HF_SYNC_DIR/apps/user-web/src/assets/images/vav-hero-couple.png" ]; then
            rm -f "$HF_SYNC_DIR/apps/user-web/src/assets/images/vav-hero-couple.png"
          fi
          if [ -f "$HF_SYNC_DIR/apps/user-web/src/assets/main.css" ]; then
            SYNC_DIR="${HF_SYNC_DIR}"
            python - <<PY
from pathlib import Path

css_path = Path("${SYNC_DIR}") / "apps/user-web/src/assets/main.css"
if css_path.exists():
    text = css_path.read_text()
    text = text.replace('url("./images/vav-hero-couple.png")', 'none')
    text = text.replace("url('./images/vav-hero-couple.png')", "none")
    css_path.write_text(text)
PY
          fi

          if ! git -C "$HF_SYNC_DIR" init -b "$TARGET_BRANCH"; then
            echo "Failed to initialize temporary deploy repo."
            exit 1
          fi
          git -C "$HF_SYNC_DIR" config user.name "github-actions[bot]"
          git -C "$HF_SYNC_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git -C "$HF_SYNC_DIR" add .; then
            echo "Failed to stage deploy snapshot."
            exit 1
          fi
          if ! git -C "$HF_SYNC_DIR" commit -m "Deploy ${GITHUB_SHA} to Hugging Face Space" --allow-empty; then
            echo "HF push failed:"
            git -C "$HF_SYNC_DIR" status --short
            exit 1
          fi

          git -C "$HF_SYNC_DIR" remote add hf "https://huggingface.co/spaces/${HF_SPACE_REPO}.git"
          if ! git -C "$HF_SYNC_DIR" -c "http.https://huggingface.co/.extraheader=Authorization: Bearer ${HF_TOKEN}" push hf "HEAD:refs/heads/${TARGET_BRANCH}" --force 2>&1 | tee /tmp/hf-push.log; then
            echo "HF push failed:"
            cat /tmp/hf-push.log
            exit 1
          fi

          echo "Verification (remote HEAD):"
          git -C "$HF_SYNC_DIR" -c "http.https://huggingface.co/.extraheader=Authorization: Bearer ${HF_TOKEN}" ls-remote hf "refs/heads/${TARGET_BRANCH}"
