# This is a reference contract for External Secrets or an equivalent secret manager controller.
# Do not add Secret values to this repository.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: vav-runtime-secrets}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: production-secret-store, kind: ClusterSecretStore}
  target: {name: vav-runtime-secrets, creationPolicy: Owner}
  data:
    - {secretKey: DATABASE_URL, remoteRef: {key: vav/production/database-url}}
    - {secretKey: REDIS_URL, remoteRef: {key: vav/production/redis-url}}
    - {secretKey: AUTH_REFRESH_TOKEN_PEPPER, remoteRef: {key: vav/production/auth-pepper}}
    - {secretKey: PRIVACY_SEARCH_HMAC_PEPPER, remoteRef: {key: vav/production/privacy-pepper}}
    - {secretKey: BACKUP_ENCRYPTION_KEY, remoteRef: {key: vav/production/backup-key}}
    - {secretKey: auth-private.pem, remoteRef: {key: vav/production/auth-private-key}}
    - {secretKey: auth-public.pem, remoteRef: {key: vav/production/auth-public-key}}
    - {secretKey: MEDIA_S3_ACCESS_KEY, remoteRef: {key: vav/production/media-access-key}}
    - {secretKey: MEDIA_S3_SECRET_KEY, remoteRef: {key: vav/production/media-secret-key}}
    - {secretKey: STRIPE_SECRET_KEY, remoteRef: {key: vav/production/stripe-secret-key}}
    - {secretKey: STRIPE_WEBHOOK_SECRET, remoteRef: {key: vav/production/stripe-webhook-secret}}
    - {secretKey: PAYPAL_CLIENT_ID, remoteRef: {key: vav/production/paypal-client-id}}
    - {secretKey: PAYPAL_CLIENT_SECRET, remoteRef: {key: vav/production/paypal-client-secret}}
    - {secretKey: PAYPAL_WEBHOOK_ID, remoteRef: {key: vav/production/paypal-webhook-id}}
    - {secretKey: NOTIFICATION_EMAIL_PROVIDER_WEBHOOK_SECRET, remoteRef: {key: vav/production/email-webhook-secret}}
