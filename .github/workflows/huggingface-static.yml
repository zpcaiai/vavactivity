name: Deploy to Hugging Face Static Space

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vavactivity-hf-static
  cancel-in-progress: false

env:
  HF_SPACE_REPO: StephenZao/vavactivity

jobs:
  deploy:
    if: github.repository == 'zpcaiai/vavactivity'
    name: Build & Deploy Static Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout frontend repo
        uses: actions/checkout@v7
        with:
          repository: zpcaiai/vavactivityWeb
          path: frontend-source
          persist-credentials: false

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install frontend dependencies
        working-directory: frontend-source
        run: corepack pnpm install --frozen-lockfile

      - name: Build user-web
        working-directory: frontend-source
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          corepack pnpm --filter @vav/design-tokens build
          corepack pnpm --filter @vav/user-web build

      - name: Build admin-web
        working-directory: frontend-source
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /admin/
        run: corepack pnpm --filter @vav/admin-web build

      - name: Assemble static site
        run: |
          mkdir -p hf-static/admin
          # user-web → root
          cp -r frontend-source/apps/user-web/dist/. hf-static/
          # admin-web → /admin/
          cp -r frontend-source/apps/admin-web/dist/. hf-static/admin/
          # HuggingFace Space README (sdk: static)
          cp README.md hf-static/README.md

      - name: Validate HuggingFace token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN is not set in GitHub Secrets." >&2
            exit 1
          fi

      - name: Push to HuggingFace Static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          HF_USERNAME="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${HF_TOKEN}" \
            https://huggingface.co/api/whoami-v2 | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')"

          cd hf-static
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy ${{ github.sha }} to HuggingFace Static Space"

          HF_CREDENTIAL_HELPER='!f() { if [ "$1" = get ]; then printf "%s\n" "username='"${HF_USERNAME}"'" "password='"${HF_TOKEN}"'"; fi; }; f'

          GIT_TERMINAL_PROMPT=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
          git \
            -c "credential.helper=${HF_CREDENTIAL_HELPER}" \
            -c "credential.interactive=0" \
            -c "http.version=HTTP/1.1" \
            push --force \
            "https://huggingface.co/spaces/${HF_SPACE_REPO}.git" \
            "HEAD:refs/heads/main"

          echo "✅ Static Space deployed: https://huggingface.co/spaces/${HF_SPACE_REPO}"
