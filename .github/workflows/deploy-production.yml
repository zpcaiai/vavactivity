name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_version: {description: Approved immutable release version, required: true, type: string}
      release_commit: {description: Full Git commit recorded in the manifest, required: true, type: string}
      release_manifest_artifact: {description: Immutable release manifest artifact, required: true, type: string}
      artifact_run_id: {description: Build workflow run containing release artifacts, required: true, type: string}
      evidence_artifact: {description: Readiness evidence artifact, required: true, type: string}
      evidence_run_id: {description: Workflow run containing readiness evidence, required: true, type: string}

permissions: {contents: read, actions: read, id-token: write}

jobs:
  evidence-gate:
    environment: production-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ inputs.release_commit }}"}
      - uses: actions/download-artifact@v8
        with:
          name: "${{ inputs.evidence_artifact }}"
          path: readiness-evidence
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          run-id: "${{ inputs.evidence_run_id }}"
      - uses: actions/download-artifact@v8
        with:
          name: "${{ inputs.release_manifest_artifact }}"
          path: release
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          run-id: "${{ inputs.artifact_run_id }}"
      - uses: astral-sh/setup-uv@v9.0.0
        with: {version: "0.8.3", python-version: "3.12"}
      - uses: azure/setup-kubectl@v5
      - run: uv sync --frozen --all-packages --all-groups
      - run: PRODUCTION_READINESS_MODE=production READINESS_EVIDENCE_DIR=readiness-evidence PRODUCTION_RELEASE_VERSION="${{ inputs.release_version }}" PRODUCTION_RELEASE_COMMIT="${{ inputs.release_commit }}" ./scripts/release/production-readiness.sh
      - run: |
          uv run --with pyyaml python scripts/release/render_deployment.py \
            --manifest release/release-manifest.yaml \
            --checksum release/release-manifest.yaml.sha256 \
            --input <(kubectl kustomize deploy/kubernetes/overlays/production) \
            --output "$RUNNER_TEMP/production-verified.yaml" \
            --expected-version "${{ inputs.release_version }}" \
            --expected-commit "${{ inputs.release_commit }}"

  deploy:
    needs: evidence-gate
    environment: production
    runs-on: ubuntu-latest
    concurrency: {group: vav-production, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ inputs.release_commit }}"}
      - uses: actions/download-artifact@v8
        with:
          name: "${{ inputs.release_manifest_artifact }}"
          path: release
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          run-id: "${{ inputs.artifact_run_id }}"
      - uses: astral-sh/setup-uv@v9.0.0
        with: {version: "0.8.3", python-version: "3.12"}
      - uses: azure/setup-kubectl@v5
      - name: Require production credentials
        env: {KUBE_CONFIG: "${{ secrets.PRODUCTION_KUBECONFIG }}"}
        run: test -n "$KUBE_CONFIG" && printf '%s' "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
      - name: Render immutable production resources
        run: |
          kubectl kustomize deploy/kubernetes/overlays/production > "$RUNNER_TEMP/production-base.yaml"
          for phase in migration application; do
            uv run --with pyyaml python scripts/release/render_deployment.py \
              --manifest release/release-manifest.yaml \
              --checksum release/release-manifest.yaml.sha256 \
              --input "$RUNNER_TEMP/production-base.yaml" \
              --output "$RUNNER_TEMP/production-$phase.yaml" \
              --expected-version "${{ inputs.release_version }}" \
              --expected-commit "${{ inputs.release_commit }}" \
              --phase "$phase"
          done
      - name: Run migration before application rollout
        run: |
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" -n vav-production delete job database-migration --ignore-not-found
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" apply -f "$RUNNER_TEMP/production-migration.yaml"
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" -n vav-production wait --for=condition=complete job/database-migration --timeout=15m
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" apply -f "$RUNNER_TEMP/production-application.yaml"
      - run: kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" -n vav-production rollout status deployment/api --timeout=15m
      - run: curl --fail --retry 18 --retry-delay 10 "${{ vars.PRODUCTION_API_URL }}/api/v1/health/ready"
