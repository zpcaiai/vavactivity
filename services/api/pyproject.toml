[project]
name = "vav-platform-api"
version = "0.1.0"
description = "VAV modular-monolith API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "boto3==1.39.14",
  "cryptography==50.0.0",
  "defusedxml==0.7.1",
  "email-validator==2.2.0",
  "fastapi==0.141.1",
  "greenlet==3.2.3",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "langgraph==1.2.9",
  "opentelemetry-api==1.36.0",
  "opentelemetry-exporter-otlp-proto-http==1.36.0",
  "opentelemetry-instrumentation-fastapi==0.57b0",
  "opentelemetry-sdk==1.36.0",
  "pillow==12.3.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pyjwt==2.13.0",
  "python-multipart==0.0.32",
  "pyyaml==6.0.2",
  "redis==5.2.1",
  "sqlalchemy==2.0.42",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
  "vav-skill-sdk==1.0.0",
]

[dependency-groups]
dev = [
  "httpx2==2.9.1",
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
  "types-defusedxml==0.7.0.20260504",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vav"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["vav"]

[[tool.mypy.overrides]]
module = ["alembic.*", "boto3.*", "botocore.*", "celery.*", "yaml.*"]
ignore_missing_imports = true
