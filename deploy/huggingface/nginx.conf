server {
    listen 7860;
    listen [::]:7860;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        default_type application/json;
        return 503 '{"error":{"code":"API_NOT_CONFIGURED","message":"Configure VITE_API_BASE_URL in the Hugging Face Space settings."}}';
    }

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
