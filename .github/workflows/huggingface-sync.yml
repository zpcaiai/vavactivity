name: Sync GitHub to Hugging Face Space

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to sync from GitHub to HF Space
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: vavactivity-hf-sync
  cancel-in-progress: false

env:
  HF_SPACE_REPO: StephenZao/vavactivity
  HF_TARGET_BRANCH_DEFAULT: main

jobs:
  sync:
    name: Sync to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN is not configured in GitHub Secrets."
            exit 1
          fi

      - name: Sync repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_BRANCH: ${{ github.event.inputs.target_branch || '' }}
        run: |
          set -euo pipefail

          SOURCE_BRANCH="${GITHUB_REF_NAME:-}"
          if [ -z "$SOURCE_BRANCH" ]; then
            if [ -n "${GITHUB_REF:-}" ]; then
              SOURCE_BRANCH="${GITHUB_REF#refs/heads/}"
            fi
          fi
          if [ -z "$SOURCE_BRANCH" ]; then
            SOURCE_BRANCH="$HF_TARGET_BRANCH_DEFAULT"
          fi
          TARGET_BRANCH="${HF_TARGET_BRANCH:-$SOURCE_BRANCH}"

          echo "Source branch: $SOURCE_BRANCH"
          echo "Configured target branch: $TARGET_BRANCH"
          echo "HF target space: $HF_SPACE_REPO"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add hf "https://huggingface.co/spaces/${HF_SPACE_REPO}.git"
          git config --local "http.https://huggingface.co/.extraheader" "Authorization: Bearer ${HF_TOKEN}"
          git remote -v
          if ! git fetch --quiet hf 2>&1 | tee /tmp/hf-fetch.log; then
            echo "HF fetch failed:"
            cat /tmp/hf-fetch.log
            exit 1
          fi

          if ! HF_DEFAULT_BRANCH="$(git ls-remote --symref hf HEAD 2>/tmp/hf-head.log | awk '/^ref:/{print $2}' | sed 's#refs/heads/##' | head -n 1 || true)"; then
            echo "HF remote HEAD query failed:"
            cat /tmp/hf-head.log
            exit 1
          fi
          if [ -z "$HF_DEFAULT_BRANCH" ]; then
            HF_DEFAULT_BRANCH="$HF_TARGET_BRANCH_DEFAULT"
          fi
          echo "HF remote default branch: $HF_DEFAULT_BRANCH"

          if ! git ls-remote --heads hf "refs/heads/${TARGET_BRANCH}" >/dev/null; then
            echo "Target branch ${TARGET_BRANCH} is missing on HF; falling back to remote default ${HF_DEFAULT_BRANCH}."
            TARGET_BRANCH="$HF_DEFAULT_BRANCH"
          fi
          echo "Resolved target branch: $TARGET_BRANCH"

          # Push source code to the resolved HF branch.
          git push hf "HEAD:refs/heads/${TARGET_BRANCH}" --force

          if [ "$TARGET_BRANCH" != "$SOURCE_BRANCH" ]; then
            echo "Also mirroring to source branch ${SOURCE_BRANCH}."
            git push hf "HEAD:refs/heads/${SOURCE_BRANCH}" --force
          fi

          echo "Verification (remote HEAD):"
          git ls-remote hf "refs/heads/${TARGET_BRANCH}"
