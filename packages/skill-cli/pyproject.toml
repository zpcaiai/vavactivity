[project]
name = "vav-skill-cli"
version = "1.0.0"
description = "Secure developer and supply-chain CLI for VAV Skills"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==50.0.0",
  "jsonschema==4.25.1",
  "pyyaml==6.0.2",
  "vav-skill-contracts==1.0.0",
  "vav-skill-runtime==1.0.0",
  "vav-skill-sdk==1.0.0",
]

[project.scripts]
vav-skill = "vav_skill_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vav_skill_cli"]

[tool.ruff]
line-length = 100
