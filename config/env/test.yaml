schema_version: "1.0.0"
environment: test
application:
  debug: false
  public_api_base_url: http://api:8000
  user_web_url: http://user-web:5173
  admin_web_url: http://admin-web:5174
  cookie_secure: false
  cors_origins: [http://user-web:5173, http://admin-web:5174]
providers: {payment: fake, email: fake, ai: deterministic_local}
