apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vav
resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployments.yaml
  - scheduler-deployment.yaml
  - web-deployments.yaml
  - web-services.yaml
  - ingress.yaml
  - migration-job.yaml
  - secrets-reference.yaml
  - network-policies.yaml
  - pod-disruption-budgets.yaml
  - horizontal-pod-autoscalers.yaml
patches:
  - target:
      kind: Deployment
      name: "^(worker-.*|scheduler)$"
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: runtime-auth, mountPath: /run/secrets, readOnly: true}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: runtime-auth
          secret:
            secretName: vav-runtime-secrets
            items:
              - {key: auth-private.pem, path: auth-private.pem}
              - {key: auth-public.pem, path: auth-public.pem}
