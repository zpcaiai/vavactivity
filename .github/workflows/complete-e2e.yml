name: Complete E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: {version: "10.14.0"}
      - uses: actions/setup-node@v4
        with: {node-version: "24.4.1", cache: pnpm}
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.8.3", python-version: "3.12", enable-cache: true}
      - run: cp .env.example .env
      - run: corepack pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-packages --all-groups
      - run: ./scripts/generate-dev-auth-keys.sh
      - run: docker compose --profile full up -d --build
      - run: ./scripts/wait-for-services.sh
      - run: docker compose exec -T api alembic upgrade head
      - run: VAV_INCLUDE_DEMO=true ./scripts/vavctl seed
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: E2E_EXTERNAL_WEBSERVERS=1 PLAYWRIGHT_CHANNEL=chromium make complete-e2e
      - if: always()
        run: docker compose logs --no-color > complete-e2e-compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-e2e-evidence
          path: |
            playwright-report
            test-results/complete-e2e
            complete-e2e-compose.log
          if-no-files-found: warn
