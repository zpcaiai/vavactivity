name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: vav
          POSTGRES_USER: vav
          POSTGRES_PASSWORD: vav_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vav -d vav"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      AI_ENABLED: "true"
      DATABASE_URL: postgresql+asyncpg://vav:vav_ci_only@localhost:5432/vav
      REDIS_URL: redis://localhost:6379/0
      NO_PROXY: localhost,127.0.0.1
      MEDIA_S3_ENDPOINT: http://localhost:9000
      MEDIA_S3_PUBLIC_ENDPOINT: http://localhost:9000
      MEDIA_S3_ACCESS_KEY: vav_minio_ci
      MEDIA_S3_SECRET_KEY: vav_minio_ci_only
      MEDIA_S3_BUCKET_PUBLIC: vav-public
      MEDIA_S3_BUCKET_PRIVATE: vav-private
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.8.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-packages --all-groups
      - name: Start deterministic object storage
        run: |
          docker run --detach --name vav-minio-ci \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=vav_minio_ci \
            --env MINIO_ROOT_PASSWORD=vav_minio_ci_only \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs vav-minio-ci
              exit 1
            fi
            sleep 2
          done
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-04-16T18-13-26Z -ec '
              mc alias set ci http://127.0.0.1:9000 vav_minio_ci vav_minio_ci_only
              mc mb --ignore-existing ci/vav-public
              mc mb --ignore-existing ci/vav-private
            '
      - name: Generate ephemeral test signing keys
        run: ./scripts/generate-dev-auth-keys.sh
      - run: uv run ruff check services
      - run: uv run ruff format --check services
      - run: uv run mypy services/api/src services/worker/src
      - run: uv run --package vav-platform-api alembic -c services/api/alembic.ini upgrade head
      - name: Seed deterministic integration fixtures
        run: |
          uv run --package vav-platform-api python -m vav.cli.seed_permissions
          uv run --package vav-platform-api python -m vav.cli.seed_cms
          uv run --package vav-platform-api python -m vav.cli.seed_catalog
          uv run --package vav-platform-api python -m vav.cli.seed_courses
          uv run --package vav-platform-api python -m vav.cli.seed_counseling
          uv run --package vav-platform-api python -m vav.cli.seed_knowledge
          uv run --package vav-platform-api python -m vav.cli.seed_ai_assistant
          uv run --package vav-platform-api python -m vav.cli.seed_notification_templates
          uv run --package vav-platform-api python -m vav.cli.seed_notifications
          uv run --package vav-platform-api python -m vav.cli.seed_privacy
          uv run --package vav-platform-api python -m vav.cli.seed_privacy_inventory
          uv run --package vav-platform-api python -m vav.cli.seed_quality
          uv run --package vav-platform-api python -m vav.cli.seed_experience
          uv run --package vav-platform-api python -m vav.cli.seed_process_governance
          uv run --package vav-platform-api python -m vav.cli.seed_data_governance
          uv run --package vav-platform-api python -m vav.cli.seed_admin_platform
          uv run --package vav-platform-api python -m vav.cli.seed_memberships
          uv run --package vav-platform-api python -m vav.cli.seed_trust_safety
      - run: uv run --package vav-platform-api pytest services/api/tests
      - run: uv run --package vav-platform-api python scripts/check_migration_heads.py
      - name: Verify the CI database reached the migration head
        run: |
          current_revision="$(uv run --package vav-platform-api alembic -c services/api/alembic.ini current)"
          printf '%s\n' "$current_revision"
          grep -Fq '(head)' <<< "$current_revision"

  neon-migrations:
    name: Apply migrations to Neon
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: neon-production-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Validate Neon migration connection
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/validate_neon_database_url.py
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.8.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --package vav-platform-api --no-dev
      - name: Verify a single migration head
        run: uv run --package vav-platform-api python scripts/check_migration_heads.py
      - name: Apply pending migrations to Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          uv run --package vav-platform-api alembic -c services/api/alembic.ini upgrade head
          uv run --package vav-platform-api python -m vav.cli.seed_permissions
          uv run --package vav-platform-api python -m vav.cli.seed_cms
          uv run --package vav-platform-api python -m vav.cli.seed_ai_assistant
          uv run --package vav-platform-api python -m vav.cli.seed_notification_templates
          uv run --package vav-platform-api python -m vav.cli.seed_notifications
          uv run --package vav-platform-api python -m vav.cli.seed_privacy
          uv run --package vav-platform-api python -m vav.cli.seed_privacy_inventory
          uv run --package vav-platform-api python -m vav.cli.seed_quality
          uv run --package vav-platform-api python -m vav.cli.seed_experience
          uv run --package vav-platform-api python -m vav.cli.seed_process_governance
          uv run --package vav-platform-api python -m vav.cli.seed_data_governance
          uv run --package vav-platform-api python -m vav.cli.seed_admin_platform
          uv run --package vav-platform-api python -m vav.cli.seed_memberships
          uv run --package vav-platform-api python -m vav.cli.seed_trust_safety
          uv run --package vav-platform-api python -m vav.cli.seed_test_user \
            --confirm-insecure-test-account
      - name: Verify the live Neon schema
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          current_revision="$(uv run --package vav-platform-api alembic -c services/api/alembic.ini current)"
          printf '%s\n' "$current_revision"
          grep -Fq '(head)' <<< "$current_revision"
