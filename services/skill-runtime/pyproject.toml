[project]
name = "vav-skill-runtime"
version = "1.0.0"
description = "Fail-closed VAV Skill resolver and execution runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==50.0.0",
  "jsonschema==4.25.1",
  "packaging==26.2",
  "pydantic==2.11.7",
  "vav-skill-sdk==1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vav_skill_runtime"]

[tool.ruff]
line-length = 100
