name: Sync GitHub to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vavactivity-hf-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN is not set. Please add it in repository secrets."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add hf "https://huggingface:${HF_TOKEN}@huggingface.co/spaces/StephenZao/vavactivity"
          git lfs install
          git push hf "main:main" --force
