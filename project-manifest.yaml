schema_version: "1.0"

project:
  name: vav-platform
  display_name: VAV 婚恋智能服务平台
  architecture: modular-monolith
  frontend_backend_separated: true
  default_timezone: UTC
  status: foundation_in_progress

applications:
  user_web:
    framework: vue
    owner: frontend
    status: foundation_in_progress
    port: 5173
  admin_web:
    framework: vue
    owner: frontend
    status: foundation_in_progress
    port: 5174
  api:
    framework: fastapi
    owner: backend
    status: foundation_in_progress
    port: 8000
  worker:
    framework: celery
    owner: platform
    status: foundation_in_progress

module_registry:
  public_site: {owner: product, status: foundation_in_progress, phase: phase_1}
  identity: {owner: backend, status: foundation_in_progress, phase: phase_1}
  activities: {owner: product, status: foundation_in_progress, phase: phase_1}
  courses: {owner: product, status: foundation_in_progress, phase: phase_1}
  counseling: {owner: product, status: planned, phase: phase_1}
  ai_assistant: {owner: ai, status: planned, phase: phase_1}
  catalog: {owner: backend, status: foundation_in_progress, phase: phase_1}
  orders: {owner: backend, status: foundation_in_progress, phase: phase_1}
  payments: {owner: backend, status: foundation_in_progress, phase: phase_1}
  admin: {owner: frontend, status: foundation_in_progress, phase: phase_1}
  dating_profile: {owner: product, status: planned, phase: phase_2}
  partner_preferences: {owner: product, status: planned, phase: phase_2}
  recommendations: {owner: matchmaking, status: planned, phase: phase_2}
  likes: {owner: matchmaking, status: planned, phase: phase_2}
  matches: {owner: matchmaking, status: planned, phase: phase_2}
  introductions: {owner: matchmaking, status: planned, phase: phase_2}
  relationship_state: {owner: matchmaking, status: planned, phase: phase_2}
  memberships: {owner: backend, status: foundation_in_progress, phase: phase_2}
  moderation: {owner: trust_and_safety, status: planned, phase: phase_2}

phases:
  phase_1:
    objective: 完成官网、账户、服务购买和运营交付闭环
    modules:
      - public_site
      - identity
      - activities
      - courses
      - counseling
      - ai_assistant
      - catalog
      - orders
      - payments
      - admin
  phase_2:
    objective: 完成建档、推荐、互选、认识期和安全治理闭环
    modules:
      - dating_profile
      - partner_preferences
      - recommendations
      - likes
      - matches
      - introductions
      - relationship_state
      - memberships
      - moderation

